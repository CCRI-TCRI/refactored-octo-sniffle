<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16243a">
  <title>Stillwater</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div>
        <p class="topbar-date" id="today-date"></p>
        <h1 class="topbar-title" id="greeting">Hello</h1>
      </div>
      <button class="sos-btn" id="sos-btn" aria-label="Get help now">Need help now?</button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab active" data-tab="today"><span class="tab-ico">☀</span>Today</button>
      <button class="tab" data-tab="journey"><span class="tab-ico">⛰</span>Journey</button>
      <button class="tab" data-tab="mood"><span class="tab-ico">◐</span>Mood</button>
      <button class="tab" data-tab="tools"><span class="tab-ico">✦</span>Toolkit</button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <button class="sheet-close" id="sheet-close" aria-label="Close">×</button>
    <div id="sheet-body"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
